<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Clean soft background -->
  <rect width="400" height="400" fill="#f0f4ff" rx="8"/>
  <rect x="10" y="10" width="380" height="380" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>
  
  <!-- Category & Brand Header Tag -->
  <rect x="25" y="25" width="150" height="24" rx="4" fill="#0284c7"/>
  <text x="100" y="41" font-family="Roboto, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">NOTHING</text>
  
  <!-- Flipkart Assured Star -->
  <circle cx="360" cy="37" r="14" fill="#2874f0"/>
  <text x="360" y="42" font-family="Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffe500" text-anchor="middle">★</text>
  
  <!-- Main Illustration Shape -->
  <g id="product-art">
    <rect x="130" y="60" width="140" height="260" rx="20" fill="#1e293b" stroke="#cbd5e1" stroke-width="4"/>
          <rect x="138" y="70" width="124" height="240" rx="14" fill="#0f172a"/>
          <!-- Dynamic Island / Camera notch -->
          <rect x="180" y="78" width="40" height="10" rx="5" fill="#000000"/>
          <!-- Screen glow -->
          <circle cx="200" cy="180" r="50" fill="#3b82f6" fill-opacity="0.25"/>
          <text x="200" y="195" font-family="Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">5G</text>
          <!-- Side buttons -->
          <rect x="127" y="100" width="3" height="25" rx="1" fill="#94a3b8"/>
          <rect x="127" y="135" width="3" height="35" rx="1" fill="#94a3b8"/>
          <rect x="270" y="115" width="3" height="40" rx="1" fill="#94a3b8"/>
  </g>
  
  <!-- View Label (Front / Side / Angle) -->
  <rect x="140" y="325" width="120" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="200" y="340" font-family="Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Side Angle</text>
  
  <!-- Model Title footer -->
  <text x="200" y="375" font-family="Roboto, sans-serif" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">Nothing Official</text>
</svg>