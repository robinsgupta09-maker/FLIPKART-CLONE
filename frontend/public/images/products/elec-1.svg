<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Clean soft background -->
  <rect width="400" height="400" fill="#f5f3ff" rx="8"/>
  <rect x="10" y="10" width="380" height="380" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>
  
  <!-- Category & Brand Header Tag -->
  <rect x="25" y="25" width="150" height="24" rx="4" fill="#4338ca"/>
  <text x="100" y="41" font-family="Roboto, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">APPLE</text>
  
  <!-- Flipkart Assured Star -->
  <circle cx="360" cy="37" r="14" fill="#2874f0"/>
  <text x="360" y="42" font-family="Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffe500" text-anchor="middle">★</text>
  
  <!-- Main Illustration Shape -->
  <g id="product-art">
    <!-- Laptop / Gadget shape -->
          <rect x="100" y="100" width="200" height="130" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/>
          <rect x="110" y="110" width="180" height="110" rx="4" fill="#0f172a"/>
          <circle cx="200" cy="165" r="30" fill="#818cf8" fill-opacity="0.3"/>
          <!-- Keyboard base -->
          <path d="M80 240 h240 l-15 20 h-210 z" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
          <rect x="175" y="244" width="50" height="10" rx="2" fill="#64748b"/>
  </g>
  
  <!-- View Label (Front / Side / Angle) -->
  <rect x="140" y="325" width="120" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="200" y="340" font-family="Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Front View</text>
  
  <!-- Model Title footer -->
  <text x="200" y="375" font-family="Roboto, sans-serif" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">Apple Official</text>
</svg>