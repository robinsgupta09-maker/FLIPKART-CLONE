<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Clean soft background -->
  <rect width="400" height="400" fill="#fffbeb" rx="8"/>
  <rect x="10" y="10" width="380" height="380" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>
  
  <!-- Category & Brand Header Tag -->
  <rect x="25" y="25" width="150" height="24" rx="4" fill="#7c3aed"/>
  <text x="100" y="41" font-family="Roboto, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">MILTON</text>
  
  <!-- Flipkart Assured Star -->
  <circle cx="360" cy="37" r="14" fill="#2874f0"/>
  <text x="360" y="42" font-family="Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffe500" text-anchor="middle">★</text>
  
  <!-- Main Illustration Shape -->
  <g id="product-art">
    <!-- Modern Armchair / Home item -->
          <path d="M120 180 h160 v50 h-160 z" fill="#d97706" rx="6"/>
          <path d="M130 110 h140 v70 h-140 z" fill="#f59e0b" rx="8"/>
          <rect x="105" y="160" width="25" height="70" rx="6" fill="#b45309"/>
          <rect x="270" y="160" width="25" height="70" rx="6" fill="#b45309"/>
          <line x1="130" y1="230" x2="120" y2="270" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
          <line x1="270" y1="230" x2="280" y2="270" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- View Label (Front / Side / Angle) -->
  <rect x="140" y="325" width="120" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="200" y="340" font-family="Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Feature View</text>
  
  <!-- Model Title footer -->
  <text x="200" y="375" font-family="Roboto, sans-serif" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">Milton Official</text>
</svg>