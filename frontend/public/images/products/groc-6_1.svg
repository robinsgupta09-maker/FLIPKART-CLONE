<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Clean soft background -->
  <rect width="400" height="400" fill="#f0fdf4" rx="8"/>
  <rect x="10" y="10" width="380" height="380" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>
  
  <!-- Category & Brand Header Tag -->
  <rect x="25" y="25" width="150" height="24" rx="4" fill="#0284c7"/>
  <text x="100" y="41" font-family="Roboto, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">NESCAFE</text>
  
  <!-- Flipkart Assured Star -->
  <circle cx="360" cy="37" r="14" fill="#2874f0"/>
  <text x="360" y="42" font-family="Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffe500" text-anchor="middle">★</text>
  
  <!-- Main Illustration Shape -->
  <g id="product-art">
    <!-- Grocery pouch / Essentials pack -->
          <path d="M130 90 h140 l-15 170 h-110 z" fill="#4ade80" stroke="#15803d" stroke-width="4"/>
          <path d="M120 85 h160 l-10 20 h-140 z" fill="#16a34a"/>
          <circle cx="200" cy="170" r="35" fill="#ffffff"/>
          <text x="200" y="177" font-family="Roboto, sans-serif" font-size="20" font-weight="900" fill="#15803d" text-anchor="middle">100%</text>
          <text x="200" y="193" font-family="Roboto, sans-serif" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">NATURAL</text>
  </g>
  
  <!-- View Label (Front / Side / Angle) -->
  <rect x="140" y="325" width="120" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="200" y="340" font-family="Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Side Angle</text>
  
  <!-- Model Title footer -->
  <text x="200" y="375" font-family="Roboto, sans-serif" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">Nescafe Official</text>
</svg>