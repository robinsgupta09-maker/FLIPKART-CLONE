<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Clean soft background -->
  <rect width="400" height="400" fill="#fff1f2" rx="8"/>
  <rect x="10" y="10" width="380" height="380" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>
  
  <!-- Category & Brand Header Tag -->
  <rect x="25" y="25" width="150" height="24" rx="4" fill="#7c3aed"/>
  <text x="100" y="41" font-family="Roboto, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">LEGO</text>
  
  <!-- Flipkart Assured Star -->
  <circle cx="360" cy="37" r="14" fill="#2874f0"/>
  <text x="360" y="42" font-family="Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffe500" text-anchor="middle">★</text>
  
  <!-- Main Illustration Shape -->
  <g id="product-art">
    <!-- Care bottle / Toy shape -->
          <rect x="150" y="130" width="100" height="140" rx="12" fill="#fb7185" stroke="#e11d48" stroke-width="4"/>
          <rect x="175" y="85" width="50" height="45" rx="4" fill="#fda4af" stroke="#e11d48" stroke-width="3"/>
          <rect x="165" y="70" width="70" height="15" rx="4" fill="#e11d48"/>
          <!-- Sparkles -->
          <circle cx="200" cy="190" r="25" fill="#ffffff" fill-opacity="0.3"/>
          <text x="200" y="196" font-family="Roboto, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">PURE</text>
  </g>
  
  <!-- View Label (Front / Side / Angle) -->
  <rect x="140" y="325" width="120" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="200" y="340" font-family="Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Feature View</text>
  
  <!-- Model Title footer -->
  <text x="200" y="375" font-family="Roboto, sans-serif" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">LEGO Official</text>
</svg>